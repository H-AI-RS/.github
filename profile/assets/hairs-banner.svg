<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 64px; letter-spacing: 4px; }
    .brand-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 23px; fill: #e2e8f0; letter-spacing: 0.5px; }
    .brand-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #94a3b8; }
    .tag-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #38bdf8; }
    .invariant-quote { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13.5px; fill: #a7f3d0; font-style: italic; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.45">
    <line x1="0" y1="76" x2="1200" y2="76" />
    <line x1="0" y1="152" x2="1200" y2="152" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="304" x2="1200" y2="304" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="960" y1="0" x2="960" y2="380" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="190" r="140" fill="#10b981" opacity="0.08" filter="url(#bannerGlow)"/>
  <circle cx="950" cy="120" r="180" fill="#6366f1" opacity="0.07" filter="url(#bannerGlow)"/>

  <!-- Left: Shield Emblem -->
  <g transform="translate(60, 90)">
    <!-- Outer Shield -->
    <polygon points="100,10 180,45 180,125 100,200 20,125 20,45" 
             fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="3" />
    
    <!-- Strands -->
    <path d="M 50,60 C 72,75 72,120 50,140" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <circle cx="50" cy="60" r="5" fill="#34d399"/>
    <circle cx="50" cy="140" r="5" fill="#10b981"/>

    <path d="M 150,60 C 128,75 128,120 150,140" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="60" r="5" fill="#06b6d4"/>
    <circle cx="150" cy="140" r="5" fill="#818cf8"/>

    <!-- AST Diamond Core -->
    <polygon points="100,75 124,90 124,120 100,135 76,120 76,90" 
             fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2.5" />
    <path d="M 90,105 L 97,112 L 112,96" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Information -->
  <g transform="translate(290, 85)">
    <!-- Main Title -->
    <text x="0" y="45" class="brand-title" fill="url(#titleGrad)">HAIRS</text>
    <text x="260" y="45" class="brand-subtitle">— Human AI Review System</text>

    <!-- Tagline description -->
    <text x="0" y="82" class="brand-desc">
      Autonomous code assurance, Roslyn AST structural fingerprinting, and deterministic CI/CD release gates.
    </text>

    <!-- Invariant Box -->
    <rect x="0" y="105" width="850" height="48" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="24" cy="129" r="6" fill="#10b981"/>
    <text x="42" y="134" class="invariant-quote">
      "Automation may assess, measure &amp; invalidate; automation may NEVER forge a human decision."
    </text>

    <!-- Pill Badges -->
    <g transform="translate(0, 175)">
      <!-- Badge 1: .NET 10 -->
      <rect x="0" y="0" width="105" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="52" y="19" class="tag-text" text-anchor="middle" fill="#38bdf8">.NET 10.0</text>

      <!-- Badge 2: C# 13 -->
      <rect x="115" y="0" width="85" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="157" y="19" class="tag-text" text-anchor="middle" fill="#818cf8">C# 13</text>

      <!-- Badge 3: Roslyn AST -->
      <rect x="210" y="0" width="125" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
      <text x="272" y="19" class="tag-text" text-anchor="middle" fill="#34d399">Roslyn AST</text>

      <!-- Badge 4: Dual-Layer Engine -->
      <rect x="345" y="0" width="165" height="30" rx="15" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
      <text x="427" y="19" class="tag-text" text-anchor="middle" fill="#a78bfa">Dual-Layer Engine</text>

      <!-- Badge 5: 375 Tests Passing -->
      <rect x="520" y="0" width="155" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="597" y="19" class="tag-text" text-anchor="middle" fill="#10b981">✓ 375 Tests 100%</text>

      <!-- Badge 6: Zero Host Coupling -->
      <rect x="685" y="0" width="165" height="30" rx="15" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/>
      <text x="767" y="19" class="tag-text" text-anchor="middle" fill="#f472b6">Zero Host Coupling</text>
    </g>
  </g>
</svg>
