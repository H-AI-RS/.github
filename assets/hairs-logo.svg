<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Backing -->
  <polygon points="100,15 175,48 175,115 100,185 25,115 25,48" 
           fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="3.5" rx="8" />

  <!-- Inner subtle grid lines -->
  <path d="M 60,65 L 140,65 M 45,100 L 155,100 M 60,135 L 140,135" 
        stroke="#334155" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  <path d="M 100,35 L 100,165" 
        stroke="#334155" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Left Strand: Human Touch (Emerald Pulse) -->
  <path d="M 55,60 C 75,75 75,115 55,130" 
        fill="none" stroke="url(#humanGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="55" cy="60" r="5" fill="#34d399" />
  <circle cx="55" cy="130" r="5" fill="#10b981" />

  <!-- Right Strand: AI Neural Wave (Violet/Cyan Mesh) -->
  <path d="M 145,60 C 125,75 125,115 145,130" 
        fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="145" cy="60" r="5" fill="#06b6d4" />
  <circle cx="145" cy="130" r="5" fill="#6366f1" />

  <!-- Central Roslyn AST Verification Core (Hexagonal Diamond Lock) -->
  <polygon points="100,72 122,86 122,114 100,128 78,114 78,86" 
           fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Checkmark / Seal Anchor -->
  <path d="M 90,100 L 97,107 L 112,92" 
        fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
